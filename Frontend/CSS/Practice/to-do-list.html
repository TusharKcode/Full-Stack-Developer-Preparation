<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="to-do-list.css">
    <title>Styled To-Do List</title>
</head>

<body>
    <h1>My To-Do List</h1>

    <ul class="todo-list">
        <li>
            <input id="task-1" type="checkbox"/>
            <label for="task-1">Explore Gaming Keyboards</label>
            <ul class="sub-item">
                <li>
                    <a href="#" target="_blank" class="sub-item-link">
                        Store Link
                    </a>
                </li>
            </ul>
        </li>
        <li>
            <input id="task-2" type="checkbox"/>
            <label for="task-2">Finish the report</label>
            <ul class="sub-item">
                <li>
                    <a href="#" target="_blank" class="sub-item-link">
                        Request Access
                    </a>
                </li>
            </ul>
        </li>
        <li>
            <input id="task-3" type="checkbox"/>
            <label for="task-3">View Phone's Warranty</label>
            <ul class="sub-item">
                <li>
                    <a href="#" target="_blank" class="sub-item-link">
                        View Receipts                    
                    </a>
                </li>
            </ul>
        </li>
        <li>
            <input id="task-4" type="checkbox"/>
            <label for="task-4">Check Processor Specs</label>
            <ul class="sub-item">
                <li>
                    <a href="#" target="_blank" class="sub-item-link">
                        View Model Number
                    </a>
                </li>
            </ul>
        </li>
    </ul>

</body>

</html>
