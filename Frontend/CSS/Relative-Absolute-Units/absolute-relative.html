<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .units {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .unit {
            background: steelblue;
            color: white;
            text-align: center;
            padding: 4px;
        }

        .px {
            width: 40px;
            height: 40px;
        }

        .inch {
            width: 0.5in;
            height: 0.5in;
        }

        .cm {
            width: 1cm;
            height: 1cm;
        }

        .mm {
            width: 10mm;
            height: 10mm;
        }

        .q {
            width: 40q;
            height: 40q;
        }

        .pc {
            width: 6pc;
            height: 6pc;
        }

        .pt {
            width: 36pt;
            height: 36pt;
        }

        html {
            font-size: 16px;
        }

        .parent {
            width: 200px;
            font-size: 20px;
            border: 2px dashed #555;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .box {
            background: seagreen;
            color: white;
            text-align: center;
            padding: 6px;
        }

        .percent {
            width: 50%;
        }

        .em {
            font-size: 2em;
        }

        .rem {
            font-size: 2rem;
        }

        .vh {
            height: 10vh;
        }

        .vw {
            width: 10vw;
        }

        .calc-box {
            width: calc(100% - 40px);
            padding: 10px;
            background: steelblue;
            color: white;
            text-align: center;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="units">
        <div class="unit px">px</div>
        <div class="unit inch">in</div>
        <div class="unit cm">cm</div>
        <div class="unit mm">mm</div>
        <div class="unit q">q</div>
        <div class="unit pc">pc</div>
        <div class="unit pt">pt</div>
    </div>

    <br><br>

    <div class="parent">
        <div class="box percent">50%</div>
        <div class="box em">2em</div>
        <div class="box rem">2rem</div>
        <div class="box vh">10vh</div>
        <div class="box vw">10vw</div>
    </div>

    <br><br>

    <div class="calc-box">calc()</div>
</body>
</html>
