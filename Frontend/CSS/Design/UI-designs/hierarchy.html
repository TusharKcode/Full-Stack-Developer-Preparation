<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fefefe;
            margin: 40px;
            line-height: 1.6;
            color: #333;
        }

        .card {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .headline {
            font-size: 32px;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subheadline {
            font-size: 20px;
            color: #555;
            margin-bottom: 20px;
        }

        .body-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .call-to-action {
            display: inline-block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .call-to-action:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="headline">Upgrade to Pro</div>
        <div class="subheadline">Get more features and storage</div>
        <div class="body-text">
            The Pro plan offers advanced tools, priority support, and 10x more storage. Perfect for professionals and teams looking to scale their productivity.
        </div>
        <a href="#" class="call-to-action">Start Free Trial</a>
    </div>
</body>
</html>
