<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .section {
            margin-bottom: 60px;
        }
        .box-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .box {
            width: 100px;
            height: 100px;
            background: #3498db;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            border-radius: 8px;
        }
        .asymmetrical .box:nth-child(2) {
            transform: scale(1.5);
            background: #e74c3c;
        }

        .description {
            text-align: center;
            margin-top: 50px;
            font-style: italic;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Composition &amp; Balance</h1>

    <div class="section symmetrical">
        <div class="box-container">
            <div class="box">A</div>
            <div class="box">B</div>
            <div class="box">A</div>
        </div>
        <div class="description">Symmetrical Balance – Equal weight on both sides.</div>
    </div>

    <div class="section asymmetrical">
        <div class="box-container">
            <div class="box">A</div>
            <div class="box">C</div>
            <div class="box">B</div>
        </div>
        <div class="description">Asymmetrical Balance – Unequal but still harmonious.</div>
    </div>
</body>
</html>
