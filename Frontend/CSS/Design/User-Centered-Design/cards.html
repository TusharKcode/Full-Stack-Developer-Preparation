<style>
    .simple-card {
        border: 1px solid #ccc;
        padding: 16px;
        width: 200px;
        text-align: center;
    }

    .simple-card img {
        max-width: 100%;
        height: auto;
    }

    .simple-card h2 {
        font-size: 1.5em;
        margin: 8px 0;
    }

    .simple-card button {
        background-color: #007BFF;
        color: white;
        padding: 10px 16px;
        border: none;
        cursor: pointer;
    }

    .clickable-card {
        border: 1px solid #ccc;
        padding: 16px;
        width: 300px;
        cursor: pointer;
    }

    .clickable-card:hover {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .clickable-card a {
        text-decoration: none;
        color: inherit;
    }

    .clickable-card img {
        max-width: 100%;
        height: auto;
    }

    .clickable-card h2 {
        font-size: 1.5em;
        margin: 8px 0;
    }

    .clickable-card button {
        background-color: #007BFF;
        color: white;
        padding: 10px 16px;
        border: none;
        cursor: pointer;
    }
    
    .card {
        border: 1px solid #ccc;
        padding: 16px;
        width: 300px;
        text-align: center;
    }

    .card img {
        max-width: 100%;
        height: auto;
    }

    .card h2 {
        font-size: 1.5em;
        margin: 8px 0;
    }

    .card button {
        background-color: #28a745; 
        color: white;
        padding: 10px 16px;
        border: none;
        cursor: pointer;
    }
</style>

<div class="simple-card">
    <img src="https://placehold.co/150x150" alt="Example Product Image">
    <h2>Product Name</h2>
    <button>Buy Now</button>
</div>
<br>
<div class="clickable-card">
    <a href="#">
        <img src="https://placehold.co/150x150" alt="Example Product Image">
        <h2>Product Name</h2>
        <button>Buy Now</button>
    </a>
</div>
<br>
<div class="card">
    <img src="https://placehold.co/150x150" alt="Example Product Image">
    <h2>Product Name</h2>
    <button>Buy Now</button>
</div>
