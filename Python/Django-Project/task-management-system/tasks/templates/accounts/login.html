{% extends 'base.html' %}

{% block title %}Login | Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 text-center">Login</h4>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {% for error in form.non_field_errors %}{{ error }}{% endfor %}
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label fw-bold">Username</label>
                        <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label fw-bold">Password</label>
                        <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">Sign In</button>
                </form>
            </div>
            <div class="card-footer bg-white text-center py-3">
                <p class="mb-0 small">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
